name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository shipped a live Anthropic key in src/services/claudeService.js.
      # A key in the app bundle is readable by anyone who downloads the app and
      # cannot be rotated without a release, so this job fails the build rather
      # than letting one reappear.
      - name: No API keys in the app bundle
        run: |
          set -euo pipefail
          patterns='sk-ant-[A-Za-z0-9_-]{20}|FLWSECK-[A-Za-z0-9]|sk_live_|AIza[0-9A-Za-z_-]{35}'
          if grep -rIEn "$patterns" \
               --exclude-dir=node_modules --exclude-dir=.git \
               --exclude-dir=.venv --exclude=package-lock.json \
               src App.js index.js app.config.js backend/triacare 2>/dev/null; then
            echo "::error::A credential appears to be committed. Revoke it, then move it to the server environment."
            exit 1
          fi
          echo "No credentials found in application source."

      # EXPO_PUBLIC_* values are inlined into the JS bundle exactly like a string
      # literal, so they are not a hiding place for a secret.
      - name: No secrets behind EXPO_PUBLIC_
        run: |
          set -euo pipefail
          if grep -rIEn 'EXPO_PUBLIC_[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD)' \
               --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null; then
            echo "::error::EXPO_PUBLIC_* is embedded in the app bundle and cannot hold a secret."
            exit 1
          fi
          echo "No secrets behind EXPO_PUBLIC_."

  app:
    name: App (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci --coverage --coverageReporters=text-summary

      # The Expo config is generated by app.config.js; a syntax error there only
      # shows up at build time otherwise.
      - name: Resolve Expo config for every environment
        run: |
          set -euo pipefail
          for env in development preview production; do
            echo "── $env"
            APP_ENV=$env npx expo config --type public > /dev/null
          done

      # Production must not point at a LAN address or allow cleartext HTTP.
      - name: Expo doctor
        run: npx expo-doctor

      - name: Production config is safe
        run: |
          set -euo pipefail
          config=$(APP_ENV=production npx expo config --type public --json)
          read -r api_base cleartext fallback plugin_cleartext <<<"$(echo "$config" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const c = JSON.parse(s);
              const bp = (c.plugins ?? []).find(p => Array.isArray(p) && p[0] === 'expo-build-properties');
              console.log(
                c.extra.apiBase,
                String(c.extra.allowCleartext),
                String(c.extra.allowLocalWalletFallback),
                String(bp?.[1]?.android?.usesCleartextTraffic)
              );
            });
          ")"

          echo "apiBase=$api_base cleartext=$cleartext localWallet=$fallback plugin=$plugin_cleartext"

          case "$api_base" in
            https://*) ;;
            *) echo "::error::Production apiBase must be HTTPS, got $api_base"; exit 1 ;;
          esac
          if echo "$api_base" | grep -qE '(localhost|127\.0\.0\.1|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)'; then
            echo "::error::Production apiBase points at a private address: $api_base"
            exit 1
          fi
          [ "$cleartext" = "false" ] || { echo "::error::Production must not allow cleartext HTTP."; exit 1; }
          # The plugin is what actually governs the build; the extra field only
          # mirrors it for this check. Both must agree.
          [ "$plugin_cleartext" = "false" ] || { echo "::error::expo-build-properties still allows cleartext in production."; exit 1; }
          # An on-device balance is forgeable; it must never gate paid access.
          [ "$fallback" = "false" ] || { echo "::error::Local wallet fallback must be off in production."; exit 1; }

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

  sync:
    name: Symptom library in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # backend/symptoms.json is generated from the app's symptoms.js. If it
      # drifts, the server prompts users about symptoms the app never showed.
      - name: Regenerate and diff
        run: |
          npm run export:symptoms
          if ! git diff --exit-code -- backend/symptoms.json; then
            echo "::error::backend/symptoms.json is stale. Run 'npm run export:symptoms' and commit the result."
            exit 1
          fi
